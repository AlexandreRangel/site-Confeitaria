<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf6ec">
  <meta name="description" content="Página não encontrada — Jana Abreu Confeitaria.">
  <title>Página não encontrada · Jana Abreu Confeitaria</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main class="catalogo" style="margin-top: 2rem;">
    <h1>Página não encontrada</h1>
    <p class="empty">Esse endereço não existe neste site. Volte ao início ou fale pelo WhatsApp.</p>
    <p style="text-align:center;">
      <a id="home-link" class="btn btn--solid" href="./">Ir ao início</a>
    </p>
  </main>
  <script>
    (function setHomeLink() {
      var link = document.getElementById("home-link");
      if (!link) return;
      var host = location.hostname || "";
      var parts = location.pathname.split("/").filter(Boolean);
      if (host.indexOf("github.io") !== -1 && parts.length) {
        link.setAttribute("href", "/" + parts[0] + "/");
      } else {
        link.setAttribute("href", "/");
      }
    })();
  </script>
</body>
</html>
