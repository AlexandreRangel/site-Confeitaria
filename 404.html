<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <script>
    (function setSiteBase() {
      var host = location.hostname || "";
      var parts = location.pathname.split("/").filter(Boolean);
      var base = "/";
      if (/\.github\.io$/i.test(host) && parts[0] && /^[A-Za-z0-9._-]+$/.test(parts[0])) {
        base = "/" + parts[0] + "/";
      }
      document.write('<base href="' + base + '">');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf6ec">
  <meta name="description" content="Página não encontrada — Jana Abreu Confeitaria.">
  <title>Página não encontrada · Jana Abreu Confeitaria</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css?v=20261116d">
  <link rel="stylesheet" href="css/layout.css?v=20261116d">
  <link rel="stylesheet" href="css/components.css?v=20261116d">
</head>
<body>
  <main class="catalogo" style="margin-top: 2rem;">
    <h1>Página não encontrada</h1>
    <p class="empty">Esse endereço não existe neste site. Volte ao início ou fale pelo WhatsApp.</p>
    <p style="text-align:center;">
      <a id="home-link" class="btn btn--solid" href="./">Ir ao início</a>
    </p>
  </main>

  <script>
    (function maybeAreaPage() {
      var parts = (location.pathname || "").split("/").filter(Boolean);
      if (/\.github\.io$/i.test(location.hostname || "") && parts[0]) parts = parts.slice(1);
      if (parts.length !== 1) return;
      var slug = String(parts[0] || "").replace(/\.html$/i, "");
      if (!/^[a-z0-9][a-z0-9-]{0,119}$/.test(slug)) return;
      var reserved = ["painel","produto","produtos","encomendas","pagamento","sobre-nos","sobre","assets","css","js","data","tests","central","docs","screenshots","scripts","area","areas","catalogo","index","404","admin","login","api","corporate","bolos","cestas","doces-personalizados","natal","pascoa","corporativo","personalizado-para-empresas","cestas-presentes","combos-festa","doces-festa","festa-personalizada","sobremesas"];
      /* Pastas estáticas já existentes não passam por aqui. */
      if (reserved.indexOf(slug) !== -1) return;
      var baseEl = document.querySelector("base");
      var root = (baseEl && baseEl.getAttribute("href")) || "/";
      if (root.slice(-1) !== "/") root += "/";
      fetch(root + "data/areas.json")
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (list) {
          if (!Array.isArray(list)) return;
          var ok = list.some(function (a) { return a && (a.slug === slug || a.id === slug); });
          if (ok) location.replace(root + "area/?c=" + encodeURIComponent(slug));
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
